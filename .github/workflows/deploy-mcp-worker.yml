name: Deploy MCP Worker (loverose-mcp)

on:
  push:
    branches: [main]
    paths:
      - 'loverose-mcp/worker/**'
      - 'loverose-mcp/src/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loverose-mcp/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run check

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Supabase secrets
        if: ${{ secrets.SUPABASE_ANON_KEY != '' }}
        run: |
          echo "${{ secrets.SUPABASE_ANON_KEY }}" | npx wrangler secret put SUPABASE_ANON_KEY
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Health check
        if: ${{ vars.MCP_WORKER_URL != '' }}
        run: |
          sleep 5
          curl -sf "${{ vars.MCP_WORKER_URL }}/health" || echo "Health check failed (non-blocking)"
YAMLEOFcat .github/workflows/deploy-mcp-worker.yml
git add .github/workflows
git commit -m "ci: deploy MCP worker"
git push origin main


