    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully!', reg))

    <script>
      (function () {
        var ua = navigator.userAgent || '';
        // Facebook's in-app browser identifies itself with FBAN/FBAV/FB_IAB,
        // Instagram's with Instagram. Messenger uses FBAN/FB_IAB too.
        var isFbInApp = /FBAN|FBAV|FB_IAB|Instagram/i.test(ua);
        if (!isFbInApp) return;

        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var currentUrl = window.location.href;

        if (isAndroid) {
          // Forces Android to hand off to Chrome, escaping Facebook's WebView.
          // Falls back to the Play Store listing if Chrome isn't installed.
          var scheme = currentUrl.replace(/^https?:\/\//, '');
          var intentUrl =
            'intent://' + scheme +
            '#Intent;scheme=https;package=com.android.chrome;' +
            'S.browser_fallback_url=' + encodeURIComponent(currentUrl) + ';end';
          window.location.href = intentUrl;
        } else if (isIOS) {
          // iOS/WebKit blocks silent redirects out of in-app browsers for
          // security reasons, so we show a clear instruction instead.
          window.addEventListener('DOMContentLoaded', function () {
            var banner = document.createElement('div');
            banner.style.cssText =
              'position:fixed;top:0;left:0;right:0;z-index:999999;' +
              'background:#f43f5e;color:#fff;font-family:sans-serif;' +
              'font-size:13px;font-weight:600;text-align:center;' +
              'padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.15);';
            banner.innerHTML =
              '👉 Pour une meilleure expérience, appuyez sur <strong>⋯</strong> en haut à droite puis <strong>"Ouvrir dans Safari"</strong>';
            document.body.prepend(banner);
          });
        }
      })();
    </script>
